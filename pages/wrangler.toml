# Pages deployment root intentionally sits outside site/ to avoid Workers build redirects.
name = "avocado-rest"
pages_build_output_dir = "../site/pages-dist"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_SITE_URL = "https://avocado.rest"
CHAT_WORKER_URL = "https://avocado-chat.avocado-chat-worker.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "avocado-chat"
database_id = "31b29b96-d036-45d1-9143-7233069154e2"
migrations_dir = "../site/migrations"

[[r2_buckets]]
binding = "NEWS_MEDIA"
bucket_name = "avocado-media"

[[services]]
binding = "CHAT_SERVICE"
service = "avocado-chat"
